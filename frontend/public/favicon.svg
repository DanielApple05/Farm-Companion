<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#49C9F3"/>
      <stop offset="1" stop-color="#19A9D8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD83D"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ED321"/>
      <stop offset="1" stop-color="#158A20"/>
    </linearGradient>
    <linearGradient id="fieldGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9CDB22"/>
      <stop offset="1" stop-color="#08752B"/>
    </linearGradient>
  </defs>

  <!-- Rounded app-icon background -->
  <rect x="18" y="18" width="476" height="476" rx="92" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="256" cy="270" r="112" fill="url(#sun)"/>

  <!-- Sun rays -->
  <g fill="#FFC21A">
    <rect x="249" y="72" width="14" height="55" rx="7"/>
    <rect x="157" y="91" width="14" height="50" rx="7" transform="rotate(-28 164 116)"/>
    <rect x="337" y="91" width="14" height="50" rx="7" transform="rotate(28 344 116)"/>
    <rect x="91" y="154" width="14" height="50" rx="7" transform="rotate(-52 98 179)"/>
    <rect x="407" y="154" width="14" height="50" rx="7" transform="rotate(52 414 179)"/>
  </g>

  <!-- Far field -->
  <path d="M38 310 Q150 282 256 310 T474 310 L474 442 L38 442 Z" fill="#B86B12"/>

  <!-- Field rows -->
  <path d="M38 337 Q145 315 256 346 T474 330 L474 442 L38 442 Z" fill="#F3A712"/>
  <path d="M38 376 Q155 335 260 372 T474 350 L474 442 L38 442 Z" fill="#7CCB20"/>
  <path d="M38 405 Q145 370 260 401 T474 383 L474 442 L38 442 Z" fill="#08752B"/>
  <path d="M38 442 L474 442 L474 410 Q350 391 256 420 Q140 448 38 416 Z" fill="#5AAE18"/>

  <!-- Central soil ridge -->
  <path d="M188 442 Q231 375 275 328 Q294 307 321 291 Q295 353 288 442 Z" fill="#6B3212"/>

  <!-- Stem -->
  <path d="M248 334 C247 295 249 257 257 225 C262 247 268 285 268 334 Z" fill="#176B20"/>

  <!-- Left leaf -->
  <path d="M257 267 C216 265 171 242 151 207 C194 197 237 210 257 249 Z"
        fill="url(#leaf)" stroke="#F4F0C7" stroke-width="8" stroke-linejoin="round"/>

  <!-- Right leaf -->
  <path d="M263 254 C283 213 329 190 374 194 C359 232 322 263 263 275 Z"
        fill="url(#leaf)" stroke="#F4F0C7" stroke-width="8" stroke-linejoin="round"/>

  <!-- Leaf veins -->
  <path d="M160 211 Q207 224 253 259" fill="none" stroke="#B7EF31" stroke-width="6" stroke-linecap="round"/>
  <path d="M268 260 Q316 226 366 199" fill="none" stroke="#B7EF31" stroke-width="6" stroke-linecap="round"/>

  <!-- Ground line -->
  <path d="M38 442 Q145 417 256 439 Q365 458 474 429 L474 474 L38 474 Z" fill="#075B25"/>
</svg>